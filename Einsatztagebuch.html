<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feuerwehr-Einsatztagebuch</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  :root {
    --red: #b3121f;
    --red-dark: #8f0e18;
    --bg: #ffffff;
    --bg-alt: #f4f5f7;
    --border: #d8dbe0;
    --text: #1c1f24;
    --text-muted: #5b6270;
    --ok: #2e7d32;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg-alt);
    color: var(--text);
    font-size: 16px;
    line-height: 1.4;
  }
  button, input { font-family: inherit; }
  h1, h2, h3 { margin: 0; }
  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
    border: 0;
  }

  /* ---------- Topbar ---------- */
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; }

  .topbar {
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 10px 20px;
    flex: none;
  }
  .topbar-title {
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
  }
  .topbar-title h1 {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--red);
    white-space: nowrap;
  }
  .status {
    font-size: 0.8rem;
    color: var(--text-muted);
  }
  .status-ok { color: var(--ok); }
  .status-error { color: var(--red); font-weight: 600; }

  .toolbar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-left: auto;
  }
  .btn {
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    padding: 7px 14px;
    border-radius: 4px;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .btn:hover { background: var(--bg-alt); }
  .btn-primary {
    background: var(--red);
    border-color: var(--red);
    color: #fff;
  }
  .btn-primary:hover { background: var(--red-dark); }

  /* ---------- 3-column layout ---------- */
  .columns {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(240px, 1fr) minmax(360px, 2.4fr) minmax(300px, 1.5fr);
    grid-template-rows: minmax(0, 1fr);
    gap: 16px;
    padding: 16px 20px;
    overflow: hidden;
  }
  .col {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .col-title {
    font-size: 0.95rem;
    color: var(--red);
    font-weight: 700;
    margin: 0 0 10px;
    flex: none;
  }

  /* ---------- Kopf column (meta fields) ---------- */
  .meta-stack {
    display: flex;
    flex-direction: column;
    gap: 10px;
    overflow-y: auto;
    flex: 1 1 auto;
    min-height: 0;
  }
  .meta-field {
    display: flex;
    flex-direction: column;
    gap: 2px;
    width: 100%;
  }
  .meta-field label {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--text-muted);
  }
  .meta-field input {
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 7px 8px;
    font-size: 0.92rem;
    background: var(--bg);
    color: var(--text);
  }
  .meta-field input:focus {
    outline: 2px solid var(--red);
    outline-offset: 1px;
  }

  /* ---------- Quick add (Tagebuch) ---------- */
  .quick-add {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    flex: none;
  }
  .quick-add-time {
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    color: var(--red);
    font-size: 1rem;
    min-width: 4.2em;
  }
  .quick-add input[type="text"] {
    flex: 1;
    min-width: 0;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 11px 12px;
    font-size: 1.05rem;
    background: var(--bg);
    color: var(--text);
  }
  .quick-add input[type="text"]:focus {
    outline: 2px solid var(--red);
    outline-offset: 1px;
  }

  /* ---------- Tagebuch search ---------- */
  .tagebuch-search {
    flex: none;
    margin-bottom: 8px;
  }
  .tagebuch-search input {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 7px 10px;
    font-size: 0.9rem;
    background: var(--bg);
    color: var(--text);
  }
  .tagebuch-search input:focus {
    outline: 2px solid var(--red);
    outline-offset: 1px;
  }

  /* ---------- Tables ---------- */
  .table-wrap {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    flex: 1 1 auto;
    min-height: 120px;
    overflow-y: auto;
  }
  table.log-table {
    width: 100%;
    border-collapse: collapse;
  }
  .log-table th {
    position: sticky;
    top: 0;
    background: var(--bg-alt);
    text-align: left;
    padding: 7px 10px;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
    z-index: 1;
  }
  .log-table td {
    padding: 7px 10px;
    border-bottom: 1px solid var(--bg-alt);
    vertical-align: top;
  }
  .log-table .col-zeit {
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    color: var(--text-muted);
    width: 5.2em;
  }
  .log-table .col-action { width: 4.4em; text-align: right; white-space: nowrap; }
  .row-deleted td { text-decoration: line-through; color: var(--text-muted); opacity: 0.6; }
  .btn-row-action {
    border: none;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 0.85rem;
    padding: 2px 4px;
    white-space: nowrap;
  }
  .btn-row-action:hover { color: var(--red); }
  .empty-row td { text-align: center; color: var(--text-muted); padding: 24px; font-style: italic; }

  .hint {
    font-size: 0.76rem;
    color: var(--text-muted);
    margin: 0 0 10px 2px;
    flex: none;
  }

  /* ---------- Roster checklists (Mitglieder / Gegenstände) ---------- */
  .roster-box {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 12px;
    flex: none;
    background: var(--bg);
  }
  .roster-box-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
  }
  .roster-box-head h3 {
    font-size: 0.74rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--text-muted);
    margin: 0;
  }
  .roster-csv { display: flex; gap: 4px; }
  .btn-csv {
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text-muted);
    font-size: 0.68rem;
    padding: 2px 7px;
    border-radius: 4px;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-csv:hover { background: var(--bg-alt); color: var(--text); }
  .roster-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
    max-height: 150px;
    overflow-y: auto;
    margin-bottom: 8px;
  }
  .roster-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px;
    border-radius: 4px;
    cursor: pointer;
  }
  .roster-item:hover { background: var(--bg-alt); }
  .roster-item input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: var(--red);
    flex-shrink: 0;
    cursor: pointer;
  }
  .roster-item span { flex: 1; font-size: 0.9rem; }
  .btn-roster-remove {
    border: none;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 0.85rem;
    padding: 2px 6px;
    visibility: hidden;
  }
  .roster-item:hover .btn-roster-remove { visibility: visible; }
  .btn-roster-remove:hover { color: var(--red); }
  .roster-empty { color: var(--text-muted); font-style: italic; font-size: 0.83rem; padding: 4px; }
  .roster-add { display: flex; gap: 6px; }
  .roster-add input[type="text"] {
    flex: 1;
    min-width: 0;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 8px;
    font-size: 0.86rem;
    background: var(--bg);
    color: var(--text);
  }
  .roster-add input[type="text"]:focus {
    outline: 2px solid var(--red);
    outline-offset: 1px;
  }

  /* ---------- Entry history / edit / comment ---------- */
  .entry-history {
    font-size: 0.78rem;
    color: var(--text-muted);
    text-decoration: line-through;
    margin-top: 2px;
  }
  .entry-comment {
    font-size: 0.82rem;
    color: var(--text);
    margin-top: 3px;
    padding-left: 8px;
    border-left: 2px solid var(--red);
  }
  .edit-input {
    width: 100%;
    border: 1px solid var(--red);
    border-radius: 4px;
    padding: 4px 6px;
    font-size: 0.95rem;
    font-family: inherit;
  }
  .edit-hint {
    font-size: 0.72rem;
    color: var(--text-muted);
    white-space: nowrap;
  }

  /* ---------- responsive: stack columns on narrow screens ---------- */
  @media (max-width: 980px) {
    html, body { height: auto; }
    body { display: block; }
    .columns {
      display: block;
      overflow: visible;
      padding: 14px;
    }
    .col {
      overflow: visible;
      margin-bottom: 14px;
    }
    .col .table-wrap { max-height: 60vh; }
    .meta-stack { overflow: visible; }
  }

  /* ---------- Print area (hidden on screen) ---------- */
  #print-area { display: none; }

  @page { size: A4; margin: 16mm 14mm; }

  @media print {
    html, body { background: #fff; height: auto; display: block; }
    #app { display: none !important; }
    #print-area {
      display: block !important;
      font-family: Arial, Helvetica, sans-serif;
      color: #000;
      font-size: 10.5pt;
      line-height: 1.35;
    }
    #print-area h1 {
      font-size: 16pt;
      margin: 0 0 6mm 0;
      border-bottom: 2pt solid #000;
      padding-bottom: 3mm;
    }
    #print-area h2 {
      font-size: 12pt;
      margin: 6mm 0 2mm;
      page-break-after: avoid;
    }
    .print-meta-table { width: 100%; border-collapse: collapse; margin-bottom: 4mm; }
    .print-meta-table th {
      text-align: left;
      width: 38mm;
      padding: 0.8mm 2mm;
      font-weight: 600;
      vertical-align: top;
    }
    .print-meta-table td { padding: 0.8mm 2mm; }
    .print-log-table { width: 100%; border-collapse: collapse; }
    .print-log-table th, .print-log-table td {
      border: 0.4pt solid #999;
      padding: 1.2mm 2mm;
      text-align: left;
      vertical-align: top;
    }
    .print-log-table th { background: #eee; }
    .print-log-table thead { display: table-header-group; }
    .print-log-table tr { page-break-inside: avoid; }
    .print-log-table td:first-child, .print-log-table th:first-child {
      width: 22mm;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .print-empty { text-align: center; font-style: italic; color: #555; }
    .print-row-deleted td { text-decoration: line-through; color: #555; }
    .print-row-history td {
      font-size: 8.5pt;
      font-style: italic;
      color: #666;
      text-decoration: line-through;
      border-top: none;
      padding-top: 0;
    }
    .print-row-comment td {
      font-size: 9pt;
      color: #000;
      border-top: none;
      padding-top: 0;
    }
    .print-footer { margin-top: 6mm; font-size: 8.5pt; color: #444; }
  }
</style>
</head>
<body>

<div id="app">
  <header class="topbar">
    <div class="topbar-title">
      <h1>Feuerwehr-Einsatztagebuch</h1>
      <span class="quick-add-time live-clock" style="font-size:0.95rem;">00:00:00</span>
      <span class="status" id="autosave-status">—</span>
      <div class="toolbar">
        <button type="button" class="btn" id="btn-new">Neuer Einsatz</button>
        <button type="button" class="btn" id="btn-load">Laden (JSON)</button>
        <button type="button" class="btn btn-primary" id="btn-save">Speichern (JSON)</button>
        <button type="button" class="btn btn-primary" id="btn-pdf">PDF Export</button>
      </div>
    </div>
  </header>

  <div class="columns">

    <section class="col col-kopf">
      <h2 class="col-title">Einsatzdaten</h2>
      <div class="meta-stack">
        <div class="meta-field">
          <label for="meta-einsatzbezeichnung">Einsatzbezeichnung</label>
          <input type="text" id="meta-einsatzbezeichnung" placeholder="z. B. Wohnungsbrand Musterstraße 12">
        </div>
        <div class="meta-field">
          <label for="meta-einsatzort">Einsatzort</label>
          <input type="text" id="meta-einsatzort" placeholder="Adresse / Ort">
        </div>
        <div class="meta-field">
          <label for="meta-einsatzstichwort">Einsatzstichwort</label>
          <input type="text" id="meta-einsatzstichwort" placeholder="z. B. B2">
        </div>
        <div class="meta-field">
          <label for="meta-einsatznummer">Einsatznummer</label>
          <input type="text" id="meta-einsatznummer">
        </div>
        <div class="meta-field">
          <label for="meta-einsatzleiter">Einsatzleiter/in</label>
          <input type="text" id="meta-einsatzleiter">
        </div>
        <div class="meta-field">
          <label for="meta-datum">Datum</label>
          <input type="date" id="meta-datum">
        </div>
        <div class="meta-field">
          <label for="meta-alarmzeit">Alarmzeit</label>
          <input type="text" id="meta-alarmzeit" placeholder="z. B. 14:32">
        </div>
      </div>
    </section>

    <section class="col col-tagebuch">
      <h2 class="col-title">Einsatztagebuch</h2>
      <form class="quick-add" id="tagebuch-form" autocomplete="off">
        <span class="quick-add-time live-clock">00:00:00</span>
        <label class="sr-only" for="tagebuch-input">Ereignis</label>
        <input type="text" id="tagebuch-input" placeholder="Ereignis eingeben und Enter drücken …" autocomplete="off" autofocus>
        <button type="submit" class="btn btn-primary">Hinzufügen</button>
      </form>
      <p class="hint">Enter speichert den Eintrag sofort mit exaktem Zeitstempel.</p>
      <div class="tagebuch-search">
        <label class="sr-only" for="tagebuch-search">Tagebuch durchsuchen</label>
        <input type="search" id="tagebuch-search" placeholder="🔍 Tagebuch durchsuchen …" autocomplete="off">
      </div>
      <div class="table-wrap">
        <table class="log-table">
          <thead>
            <tr>
              <th class="col-zeit">Zeit</th>
              <th>Ereignis</th>
              <th class="col-action"></th>
            </tr>
          </thead>
          <tbody id="tagebuch-body"></tbody>
        </table>
      </div>
    </section>

    <section class="col col-kraefte">
      <h2 class="col-title">Eingesetzte Kräfte</h2>
      <div class="roster-box">
        <div class="roster-box-head">
          <h3>Mitglieder</h3>
          <div class="roster-csv">
            <button type="button" class="btn-csv" id="btn-mitglied-csv-import" title="Mitglieder aus CSV-Datei importieren (eine Angabe pro Zeile)">CSV ↑</button>
            <button type="button" class="btn-csv" id="btn-mitglied-csv-export" title="Aktuelle Mitgliederliste als CSV speichern">CSV ↓</button>
          </div>
        </div>
        <div class="roster-list" id="roster-mitglieder-list"></div>
        <form class="roster-add" id="mitglied-add-form" autocomplete="off">
          <label class="sr-only" for="mitglied-add-input">Mitglied hinzufügen</label>
          <input type="text" id="mitglied-add-input" placeholder="Mitglied hinzufügen …" autocomplete="off">
          <button type="submit" class="btn">+</button>
        </form>
      </div>
      <div class="roster-box">
        <div class="roster-box-head">
          <h3>Gegenstände</h3>
          <div class="roster-csv">
            <button type="button" class="btn-csv" id="btn-gegenstand-csv-import" title="Gegenstände aus CSV-Datei importieren (eine Angabe pro Zeile)">CSV ↑</button>
            <button type="button" class="btn-csv" id="btn-gegenstand-csv-export" title="Aktuelle Gegenständeliste als CSV speichern">CSV ↓</button>
          </div>
        </div>
        <div class="roster-list" id="roster-gegenstaende-list"></div>
        <form class="roster-add" id="gegenstand-add-form" autocomplete="off">
          <label class="sr-only" for="gegenstand-add-input">Gegenstand hinzufügen</label>
          <input type="text" id="gegenstand-add-input" placeholder="Gegenstand hinzufügen …" autocomplete="off">
          <button type="submit" class="btn">+</button>
        </form>
      </div>
      <p class="hint">Häkchen protokolliert automatisch mit Zeitstempel. 💬 fügt einen Kommentar hinzu.</p>
      <div class="table-wrap">
        <table class="log-table">
          <thead>
            <tr>
              <th class="col-zeit">Zeit</th>
              <th>Einheit</th>
              <th class="col-action"></th>
            </tr>
          </thead>
          <tbody id="kraefte-body"></tbody>
        </table>
      </div>
    </section>

  </div>
</div>

<input type="file" id="file-input" accept="application/json,.json" hidden>
<input type="file" id="csv-input" accept=".csv,text/csv,text/plain" hidden>

<div id="print-area" aria-hidden="true"></div>

<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'feuerwehr_einsatztagebuch_v1';
  var META_FIELDS = ['einsatzbezeichnung', 'einsatzort', 'einsatzstichwort', 'einsatznummer', 'einsatzleiter', 'datum', 'alarmzeit'];

  var state = null;
  var editingTagebuchId = null;
  var editingKraefteId = null;
  var editingCommentKraefteId = null;
  var csvImportKind = null;
  var tagebuchFilter = '';

  /* ---------- helpers ---------- */

  function pad(n) { return String(n).padStart(2, '0'); }

  function uid() {
    return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
  }

  function toDateInputValue(d) {
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  function formatZeit(iso) {
    var d = new Date(iso);
    return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  }

  function formatDatum(iso) {
    var d = new Date(iso);
    return pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.' + d.getFullYear();
  }

  function formatDatumInput(value) {
    var parts = (value || '').split('-');
    if (parts.length !== 3) return value || '';
    return parts[2] + '.' + parts[1] + '.' + parts[0];
  }

  /* ---------- state ---------- */

  function blankState() {
    var now = new Date();
    return {
      formatVersion: 1,
      meta: {
        einsatzbezeichnung: '',
        einsatzort: '',
        einsatzstichwort: '',
        einsatznummer: '',
        einsatzleiter: '',
        datum: toDateInputValue(now),
        alarmzeit: ''
      },
      tagebuch: [],
      kraefte: [],
      erstelltAm: now.toISOString(),
      zuletztGeaendert: now.toISOString()
    };
  }

  function normalizeHistory(history) {
    if (!Array.isArray(history)) return [];
    return history.map(function (h) {
      if (typeof h === 'string') return { text: h, zeit: '' };
      return { text: h.text || '', zeit: h.zeit || '' };
    });
  }

  function normalizeTagebuchEntry(e) {
    return {
      id: e.id || uid(),
      zeit: e.zeit || new Date().toISOString(),
      text: e.text || '',
      geloescht: !!e.geloescht,
      history: normalizeHistory(e.history)
    };
  }

  function normalizeKraefteEntry(e) {
    return {
      id: e.id || uid(),
      zeit: e.zeit || new Date().toISOString(),
      einheit: e.einheit || '',
      aktion: e.aktion || undefined,
      kommentar: e.kommentar || '',
      geloescht: !!e.geloescht,
      history: normalizeHistory(e.history)
    };
  }

  function normalizeState(parsed) {
    var base = blankState();
    return {
      formatVersion: 1,
      meta: Object.assign({}, base.meta, parsed.meta || {}),
      tagebuch: (parsed.tagebuch || []).map(normalizeTagebuchEntry),
      kraefte: (parsed.kraefte || []).map(normalizeKraefteEntry),
      erstelltAm: parsed.erstelltAm || base.erstelltAm,
      zuletztGeaendert: new Date().toISOString()
    };
  }

  function loadFromStorage() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      var parsed = JSON.parse(raw);
      if (parsed && parsed.meta && Array.isArray(parsed.tagebuch) && Array.isArray(parsed.kraefte)) {
        return normalizeState(parsed);
      }
    } catch (err) {
      console.warn('Konnte gespeicherten Stand nicht laden:', err);
    }
    return null;
  }

  function persist() {
    try {
      state.zuletztGeaendert = new Date().toISOString();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      setAutosaveStatus(true);
    } catch (err) {
      setAutosaveStatus(false);
    }
  }

  function setAutosaveStatus(ok) {
    var el = document.getElementById('autosave-status');
    if (!el) return;
    if (ok) {
      var now = new Date();
      el.textContent = 'Automatisch gespeichert · ' + pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
      el.className = 'status status-ok';
    } else {
      el.textContent = '⚠ Lokales Speichern fehlgeschlagen — bitte jetzt als JSON exportieren!';
      el.className = 'status status-error';
    }
  }

  /* ---------- roster (Mitglieder / Gegenstände) ---------- */

  var ROSTER_KEY = 'feuerwehr_einsatztagebuch_roster_v1';
  var roster = null;

  function blankRoster() {
    return {
      mitglieder: [],
      gegenstaende: [
        'LF (Löschfahrzeug)', 'TLF (Tanklöschfahrzeug)', 'DLK (Drehleiter)', 'RW (Rüstwagen)',
        'ELW 1', 'ELW 2', 'MTW', 'GW (Gerätewagen)', 'KdoW', 'RTW', 'NEF',
        'C-Rohr', 'B-Rohr', 'D-Rohr', 'Schaumrohr',
        'Pressluftatmer (PA)', 'Wärmebildkamera', 'Rettungsschere', 'Stromerzeuger', 'Belüftungsgerät'
      ]
    };
  }

  function loadRoster() {
    try {
      var raw = localStorage.getItem(ROSTER_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.mitglieder) && Array.isArray(parsed.gegenstaende)) {
          return parsed;
        }
      }
    } catch (err) {
      console.warn('Konnte Mitglieder-/Gegenstände-Liste nicht laden:', err);
    }
    return blankRoster();
  }

  function persistRoster() {
    try {
      localStorage.setItem(ROSTER_KEY, JSON.stringify(roster));
    } catch (err) {
      setAutosaveStatus(false);
    }
  }

  function isChecked(name) {
    for (var i = state.kraefte.length - 1; i >= 0; i--) {
      var e = state.kraefte[i];
      if (e.geloescht || e.einheit !== name || !e.aktion) continue;
      return e.aktion === 'eingesetzt';
    }
    return false;
  }

  function toggleRosterItem(name) {
    var newAktion = isChecked(name) ? 'abgerückt' : 'eingesetzt';
    state.kraefte.push({ id: uid(), zeit: new Date().toISOString(), einheit: name, aktion: newAktion, kommentar: '', geloescht: false, history: [] });
    persist();
    renderKraefte();
    renderRosterLists();
    scrollTableToBottom('kraefte-body');
  }

  /* ---------- CSV import / export for roster ---------- */

  function parseCsvList(text) {
    text = String(text).replace(/^﻿/, '');
    var out = [];
    text.split(/\r?\n/).forEach(function (line) {
      var v = line.trim();
      if (!v) return;
      if (v.length >= 2 && v.charAt(0) === '"' && v.charAt(v.length - 1) === '"') {
        v = v.slice(1, -1).replace(/""/g, '"');
      }
      v = v.trim();
      if (v) out.push(v);
    });
    return out;
  }

  function importRosterCsv(kind, text) {
    var incoming = parseCsvList(text);
    var label = kind === 'mitglieder' ? 'Mitglieder' : 'Gegenstände';
    if (incoming.length === 0) {
      window.alert('Keine Einträge in der Datei gefunden.\n\nErwartet wird eine Angabe pro Zeile.');
      return;
    }
    var existing = roster[kind];
    var added = 0, skipped = 0;
    incoming.forEach(function (name) {
      if (existing.indexOf(name) === -1) { existing.push(name); added++; }
      else { skipped++; }
    });
    persistRoster();
    renderRosterLists();
    window.alert(label + '-Import abgeschlossen:\n' + added + ' neu hinzugefügt, ' + skipped + ' bereits vorhanden.');
  }

  function exportRosterCsv(kind) {
    var lines = roster[kind].map(function (name) {
      return /[",\n\r]/.test(name) ? '"' + name.replace(/"/g, '""') + '"' : name;
    });
    var csv = '﻿' + lines.join('\r\n') + (lines.length ? '\r\n' : '');
    var blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = (kind === 'mitglieder' ? 'Mitglieder' : 'Gegenstaende') + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function addRosterItem(kind, name) {
    name = (name || '').trim();
    if (!name || roster[kind].indexOf(name) !== -1) return;
    roster[kind].push(name);
    persistRoster();
    renderRosterLists();
  }

  function removeRosterItem(kind, name) {
    var ok = window.confirm('„' + name + '" aus der Liste entfernen?\n\nBereits erfasste Einträge im Tagebuch bleiben erhalten, nur der Schnellauswahl-Eintrag verschwindet.');
    if (!ok) return;
    roster[kind] = roster[kind].filter(function (n) { return n !== name; });
    persistRoster();
    renderRosterLists();
  }

  function renderRosterList(containerId, kind) {
    var container = document.getElementById(containerId);
    container.innerHTML = '';
    var items = roster[kind];
    if (items.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'roster-empty';
      empty.textContent = 'Noch keine Einträge — unten hinzufügen.';
      container.appendChild(empty);
      return;
    }
    items.forEach(function (name) {
      var label = document.createElement('label');
      label.className = 'roster-item';

      var checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = isChecked(name);
      checkbox.addEventListener('change', function () {
        toggleRosterItem(name);
      });
      label.appendChild(checkbox);

      var span = document.createElement('span');
      span.textContent = name;
      label.appendChild(span);

      var removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.className = 'btn-roster-remove';
      removeBtn.textContent = '×';
      removeBtn.title = 'Aus der Liste entfernen';
      removeBtn.addEventListener('click', function (ev) {
        ev.preventDefault();
        ev.stopPropagation();
        removeRosterItem(kind, name);
      });
      label.appendChild(removeBtn);

      container.appendChild(label);
    });
  }

  function renderRosterLists() {
    renderRosterList('roster-mitglieder-list', 'mitglieder');
    renderRosterList('roster-gegenstaende-list', 'gegenstaende');
  }

  function displayEinheitText(entry) {
    if (!entry.aktion) return entry.einheit;
    return entry.einheit + ' – ' + entry.aktion;
  }

  /* ---------- rendering ---------- */

  function updateDocumentTitle() {
    document.title = 'Feuerwehr-Einsatztagebuch' + (state.meta.einsatzbezeichnung ? ' – ' + state.meta.einsatzbezeichnung : '');
  }

  function updateMetaFieldValues() {
    META_FIELDS.forEach(function (key) {
      var el = document.getElementById('meta-' + key);
      if (el) el.value = state.meta[key] || '';
    });
  }

  function renderEmptyRow(tbody, colspan, message) {
    var tr = document.createElement('tr');
    tr.className = 'empty-row';
    var td = document.createElement('td');
    td.colSpan = colspan;
    td.textContent = message;
    tr.appendChild(td);
    tbody.appendChild(tr);
  }

  function buildHistoryNodes(entry) {
    var nodes = [];
    if (entry.history && entry.history.length) {
      entry.history.slice().reverse().forEach(function (old) {
        var div = document.createElement('div');
        div.className = 'entry-history';
        div.textContent = 'vorher: ' + old.text;
        nodes.push(div);
      });
    }
    return nodes;
  }

  function buildEditInput(listName, entry, currentValue) {
    var input = document.createElement('input');
    input.type = 'text';
    input.className = 'edit-input';
    input.value = currentValue;
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
      else if (e.key === 'Escape') { e.preventDefault(); input.dataset.cancelled = '1'; input.blur(); }
    });
    input.addEventListener('blur', function () {
      if (input.dataset.cancelled === '1') {
        if (listName === 'tagebuch') editingTagebuchId = null; else editingKraefteId = null;
        listName === 'tagebuch' ? renderTagebuch() : renderKraefte();
        return;
      }
      commitEdit(listName, entry.id, input.value);
    });
    return input;
  }

  function renderTagebuch() {
    var tbody = document.getElementById('tagebuch-body');
    tbody.innerHTML = '';
    if (state.tagebuch.length === 0) {
      renderEmptyRow(tbody, 3, 'Noch keine Einträge.');
      return;
    }
    var filter = tagebuchFilter.trim().toLowerCase();
    var entries = filter ? state.tagebuch.filter(function (e) {
      if (e.text && e.text.toLowerCase().indexOf(filter) !== -1) return true;
      if (e.history && e.history.some(function (h) { return h.text && h.text.toLowerCase().indexOf(filter) !== -1; })) return true;
      return false;
    }) : state.tagebuch;
    if (entries.length === 0) {
      renderEmptyRow(tbody, 3, 'Keine Treffer für „' + tagebuchFilter.trim() + '".');
      return;
    }
    entries.forEach(function (entry) {
      var tr = document.createElement('tr');
      if (entry.geloescht) tr.className = 'row-deleted';

      var tdZeit = document.createElement('td');
      tdZeit.className = 'col-zeit';
      tdZeit.textContent = formatZeit(entry.zeit);
      tr.appendChild(tdZeit);

      var tdText = document.createElement('td');
      if (editingTagebuchId === entry.id) {
        var input = buildEditInput('tagebuch', entry, entry.text);
        tdText.appendChild(input);
      } else {
        var textDiv = document.createElement('div');
        textDiv.textContent = entry.text;
        tdText.appendChild(textDiv);
        buildHistoryNodes(entry).forEach(function (n) { tdText.appendChild(n); });
      }
      tr.appendChild(tdText);

      tr.appendChild(buildActionCell('tagebuch', entry, editingTagebuchId === entry.id));
      tbody.appendChild(tr);
      if (editingTagebuchId === entry.id) { input.focus(); input.select(); }
    });
  }

  function buildCommentInput(entry) {
    var input = document.createElement('input');
    input.type = 'text';
    input.className = 'edit-input';
    input.value = entry.kommentar || '';
    input.placeholder = 'Kommentar …';
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
      else if (e.key === 'Escape') { e.preventDefault(); input.dataset.cancelled = '1'; input.blur(); }
    });
    input.addEventListener('blur', function () {
      var cancelled = input.dataset.cancelled === '1';
      var value = input.value;
      editingCommentKraefteId = null;
      if (cancelled) { renderKraefte(); return; }
      commitComment(entry.id, value);
    });
    return input;
  }

  function commitComment(id, value) {
    var entry = state.kraefte.find(function (e) { return e.id === id; });
    if (!entry) { renderKraefte(); return; }
    var v = (value || '').trim();
    if (v !== (entry.kommentar || '')) {
      entry.kommentar = v;
      persist();
    }
    renderKraefte();
  }

  function renderKraefte() {
    var tbody = document.getElementById('kraefte-body');
    tbody.innerHTML = '';
    if (state.kraefte.length === 0) {
      renderEmptyRow(tbody, 3, 'Noch keine Einträge.');
      return;
    }
    state.kraefte.forEach(function (entry) {
      var tr = document.createElement('tr');
      if (entry.geloescht) tr.className = 'row-deleted';

      var tdZeit = document.createElement('td');
      tdZeit.className = 'col-zeit';
      tdZeit.textContent = formatZeit(entry.zeit);
      tr.appendChild(tdZeit);

      var editingText = editingKraefteId === entry.id;
      var editingComment = editingCommentKraefteId === entry.id;
      var textInput = null;
      var commentInput = null;

      var tdEinheit = document.createElement('td');
      if (editingText) {
        textInput = buildEditInput('kraefte', entry, entry.einheit);
        tdEinheit.appendChild(textInput);
      } else {
        var textDiv = document.createElement('div');
        textDiv.textContent = displayEinheitText(entry);
        tdEinheit.appendChild(textDiv);
        buildHistoryNodes(entry).forEach(function (n) { tdEinheit.appendChild(n); });
        if (editingComment) {
          commentInput = buildCommentInput(entry);
          tdEinheit.appendChild(commentInput);
        } else if (entry.kommentar) {
          var cDiv = document.createElement('div');
          cDiv.className = 'entry-comment';
          cDiv.textContent = entry.kommentar;
          tdEinheit.appendChild(cDiv);
        }
      }
      tr.appendChild(tdEinheit);

      tr.appendChild(buildActionCell('kraefte', entry, editingText || editingComment));
      tbody.appendChild(tr);
      if (textInput) { textInput.focus(); textInput.select(); }
      if (commentInput) { commentInput.focus(); commentInput.select(); }
    });
  }

  function commitEdit(listName, id, newValue) {
    var list = state[listName];
    var entry = list.find(function (e) { return e.id === id; });
    if (listName === 'tagebuch') editingTagebuchId = null; else editingKraefteId = null;
    if (!entry) { listName === 'tagebuch' ? renderTagebuch() : renderKraefte(); return; }

    var field = listName === 'tagebuch' ? 'text' : 'einheit';
    newValue = (newValue || '').trim();
    if (!newValue || newValue === entry[field]) {
      listName === 'tagebuch' ? renderTagebuch() : renderKraefte();
      return;
    }
    if (!entry.history) entry.history = [];
    entry.history.push({ text: entry[field], zeit: new Date().toISOString() });
    entry[field] = newValue;
    persist();
    listName === 'tagebuch' ? renderTagebuch() : renderKraefte();
  }

  function buildActionCell(listName, entry, isEditing) {
    var td = document.createElement('td');
    td.className = 'col-action';

    if (isEditing) {
      var hint = document.createElement('span');
      hint.className = 'edit-hint';
      hint.textContent = 'Enter ↵';
      td.appendChild(hint);
      return td;
    }

    if (!entry.geloescht) {
      var editBtn = document.createElement('button');
      editBtn.type = 'button';
      editBtn.className = 'btn-row-action btn-row-edit';
      editBtn.textContent = '✎';
      editBtn.title = 'Eintrag bearbeiten (Original bleibt sichtbar)';
      editBtn.addEventListener('click', function () {
        if (listName === 'tagebuch') { editingTagebuchId = entry.id; renderTagebuch(); }
        else { editingKraefteId = entry.id; editingCommentKraefteId = null; renderKraefte(); }
      });
      td.appendChild(editBtn);

      if (listName === 'kraefte') {
        var commentBtn = document.createElement('button');
        commentBtn.type = 'button';
        commentBtn.className = 'btn-row-action btn-row-comment';
        commentBtn.textContent = '💬';
        commentBtn.title = entry.kommentar ? 'Kommentar bearbeiten' : 'Kommentar hinzufügen';
        commentBtn.addEventListener('click', function () {
          editingCommentKraefteId = entry.id;
          editingKraefteId = null;
          renderKraefte();
        });
        td.appendChild(commentBtn);
      }
    }

    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn-row-action btn-row-delete';
    btn.textContent = entry.geloescht ? 'Wiederherstellen' : '✕';
    btn.title = entry.geloescht ? 'Eintrag wiederherstellen' : 'Eintrag entfernen (durchstreichen)';
    btn.addEventListener('click', function () {
      toggleDelete(listName, entry.id);
    });
    td.appendChild(btn);
    return td;
  }

  function toggleDelete(listName, id) {
    var list = state[listName];
    var entry = list.find(function (e) { return e.id === id; });
    if (!entry) return;
    entry.geloescht = !entry.geloescht;
    if (listName === 'tagebuch' && editingTagebuchId === id) editingTagebuchId = null;
    if (listName === 'kraefte' && editingKraefteId === id) editingKraefteId = null;
    if (listName === 'kraefte' && editingCommentKraefteId === id) editingCommentKraefteId = null;
    persist();
    renderAll();
    if (listName === 'kraefte') renderRosterLists();
  }

  function renderAll() {
    updateMetaFieldValues();
    updateDocumentTitle();
    renderTagebuch();
    renderKraefte();
    if (roster) renderRosterLists();
  }

  function scrollTableToBottom(tbodyId) {
    var tbody = document.getElementById(tbodyId);
    var wrap = tbody && tbody.closest('.table-wrap');
    if (wrap) wrap.scrollTop = wrap.scrollHeight;
  }

  /* ---------- entries ---------- */

  function addTagebuchEntry(text) {
    text = (text || '').trim();
    if (!text) return;
    state.tagebuch.push({ id: uid(), zeit: new Date().toISOString(), text: text, geloescht: false, history: [] });
    persist();
    renderTagebuch();
    scrollTableToBottom('tagebuch-body');
  }

  /* ---------- JSON export / import ---------- */

  function buildFilename(ext) {
    var name = (state.meta.einsatzbezeichnung || 'Einsatz').trim();
    name = name.replace(/[^\p{L}\p{N}]+/gu, '_').replace(/^_+|_+$/g, '');
    if (!name) name = 'Einsatz';
    var now = new Date();
    var stamp = now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate()) + '_' + pad(now.getHours()) + pad(now.getMinutes());
    return 'Einsatztagebuch_' + name + '_' + stamp + '.' + ext;
  }

  function exportJson() {
    var dataStr = JSON.stringify(state, null, 2);
    var blob = new Blob([dataStr], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = buildFilename('json');
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function importJsonFile(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var parsed = JSON.parse(String(reader.result));
        if (!parsed || !parsed.meta || !Array.isArray(parsed.tagebuch) || !Array.isArray(parsed.kraefte)) {
          throw new Error('Ungültiges Format — es fehlen erwartete Felder (meta, tagebuch, kraefte).');
        }
        state = normalizeState(parsed);
        editingTagebuchId = editingKraefteId = editingCommentKraefteId = null;
        clearTagebuchSearch();
        persist();
        renderAll();
        focusTagebuch();
        window.alert('Einsatz geladen: ' + (state.meta.einsatzbezeichnung || '(ohne Bezeichnung)'));
      } catch (err) {
        window.alert('Die Datei konnte nicht geladen werden. Ist es eine gültige Einsatztagebuch-JSON-Datei?\n\n' + err.message);
      }
    };
    reader.readAsText(file, 'utf-8');
  }

  /* ---------- PDF / print ---------- */

  function buildPrintSection(heading, entries, columns, rowMapper) {
    var section = document.createElement('div');
    section.className = 'print-section';
    var h2 = document.createElement('h2');
    h2.textContent = heading;
    section.appendChild(h2);

    var table = document.createElement('table');
    table.className = 'print-log-table';
    var thead = document.createElement('thead');
    var headRow = document.createElement('tr');
    columns.forEach(function (c) {
      var th = document.createElement('th');
      th.textContent = c;
      headRow.appendChild(th);
    });
    thead.appendChild(headRow);
    table.appendChild(thead);

    var tbody = document.createElement('tbody');
    if (entries.length === 0) {
      var tr = document.createElement('tr');
      var td = document.createElement('td');
      td.colSpan = columns.length;
      td.textContent = 'Keine Einträge.';
      td.className = 'print-empty';
      tr.appendChild(td);
      tbody.appendChild(tr);
    } else {
      entries.forEach(function (e) {
        var row = document.createElement('tr');
        if (e.geloescht) row.className = 'print-row-deleted';
        var values = rowMapper(e);
        values.forEach(function (val, idx) {
          var cell = document.createElement('td');
          cell.textContent = (idx === values.length - 1 && e.geloescht) ? val + ' (gelöscht)' : val;
          row.appendChild(cell);
        });
        tbody.appendChild(row);

        if (e.kommentar) {
          var comRow = document.createElement('tr');
          comRow.className = 'print-row-comment';
          var comTimeCell = document.createElement('td');
          comTimeCell.textContent = '';
          comRow.appendChild(comTimeCell);
          var comTextCell = document.createElement('td');
          comTextCell.colSpan = columns.length - 1;
          comTextCell.textContent = 'Kommentar: ' + e.kommentar;
          comRow.appendChild(comTextCell);
          tbody.appendChild(comRow);
        }

        if (e.history && e.history.length) {
          e.history.slice().reverse().forEach(function (old) {
            var histRow = document.createElement('tr');
            histRow.className = 'print-row-history';
            var histTimeCell = document.createElement('td');
            histTimeCell.textContent = '';
            histRow.appendChild(histTimeCell);
            var histTextCell = document.createElement('td');
            histTextCell.colSpan = columns.length - 1;
            histTextCell.textContent = 'vorher: ' + old.text;
            histRow.appendChild(histTextCell);
            tbody.appendChild(histRow);
          });
        }
      });
    }
    table.appendChild(tbody);
    section.appendChild(table);
    return section;
  }

  function buildPrintArea() {
    var root = document.getElementById('print-area');
    root.innerHTML = '';

    var title = document.createElement('h1');
    title.textContent = 'Feuerwehr-Einsatztagebuch';
    root.appendChild(title);

    var metaTable = document.createElement('table');
    metaTable.className = 'print-meta-table';
    var metaRows = [
      ['Einsatzbezeichnung', state.meta.einsatzbezeichnung],
      ['Einsatzort', state.meta.einsatzort],
      ['Einsatzstichwort', state.meta.einsatzstichwort],
      ['Einsatznummer', state.meta.einsatznummer],
      ['Einsatzleiter/in', state.meta.einsatzleiter],
      ['Datum', formatDatumInput(state.meta.datum)],
      ['Alarmzeit', state.meta.alarmzeit]
    ];
    metaRows.forEach(function (pair) {
      var tr = document.createElement('tr');
      var th = document.createElement('th');
      th.textContent = pair[0];
      var td = document.createElement('td');
      td.textContent = pair[1] || '—';
      tr.appendChild(th);
      tr.appendChild(td);
      metaTable.appendChild(tr);
    });
    root.appendChild(metaTable);

    root.appendChild(buildPrintSection('Einsatztagebuch', state.tagebuch, ['Zeit', 'Ereignis'], function (e) {
      return [formatZeit(e.zeit), e.text];
    }));

    root.appendChild(buildPrintSection('Eingesetzte Kräfte', state.kraefte, ['Zeit', 'Einheit'], function (e) {
      return [formatZeit(e.zeit), displayEinheitText(e)];
    }));

    var footer = document.createElement('p');
    footer.className = 'print-footer';
    var now = new Date();
    footer.textContent = 'PDF erstellt am ' + formatDatum(now.toISOString()) + ' um ' + formatZeit(now.toISOString()) + ' Uhr.';
    root.appendChild(footer);
  }

  function printReport() {
    buildPrintArea();
    var titleBefore = document.title;
    document.title = buildFilename('pdf').replace(/\.pdf$/, '');
    window.print();
    document.title = titleBefore;
  }

  function focusTagebuch() {
    var el = document.getElementById('tagebuch-input');
    if (el) el.focus();
  }

  function clearTagebuchSearch() {
    tagebuchFilter = '';
    var s = document.getElementById('tagebuch-search');
    if (s) s.value = '';
  }

  /* ---------- new incident ---------- */

  function handleNewIncident() {
    var hasContent = state.tagebuch.length > 0 || state.kraefte.length > 0 || state.meta.einsatzbezeichnung;
    if (hasContent) {
      var ok = window.confirm('Neuen Einsatz beginnen?\n\nDer aktuell angezeigte Einsatz wird zurückgesetzt. Bitte vorher als JSON speichern, falls die Daten erhalten bleiben sollen.');
      if (!ok) return;
    }
    state = blankState();
    editingTagebuchId = editingKraefteId = editingCommentKraefteId = null;
    clearTagebuchSearch();
    persist();
    renderAll();
    focusTagebuch();
  }

  /* ---------- init ---------- */

  function initMetaFields() {
    META_FIELDS.forEach(function (key) {
      var el = document.getElementById('meta-' + key);
      if (!el) return;
      el.addEventListener('input', function () {
        state.meta[key] = el.value;
        persist();
        updateDocumentTitle();
      });
    });
  }

  function initCsv() {
    document.getElementById('btn-mitglied-csv-import').addEventListener('click', function () {
      csvImportKind = 'mitglieder';
      document.getElementById('csv-input').click();
    });
    document.getElementById('btn-gegenstand-csv-import').addEventListener('click', function () {
      csvImportKind = 'gegenstaende';
      document.getElementById('csv-input').click();
    });
    document.getElementById('btn-mitglied-csv-export').addEventListener('click', function () {
      exportRosterCsv('mitglieder');
    });
    document.getElementById('btn-gegenstand-csv-export').addEventListener('click', function () {
      exportRosterCsv('gegenstaende');
    });
    document.getElementById('csv-input').addEventListener('change', function (e) {
      var file = e.target.files[0];
      var kind = csvImportKind;
      csvImportKind = null;
      if (file && kind) {
        var reader = new FileReader();
        reader.onload = function () { importRosterCsv(kind, reader.result); };
        reader.readAsText(file, 'utf-8');
      }
      e.target.value = '';
    });
  }

  function initForms() {
    document.getElementById('tagebuch-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var input = document.getElementById('tagebuch-input');
      // a new event returns the view to the full log (a stale filter would hide it)
      if (tagebuchFilter) {
        tagebuchFilter = '';
        document.getElementById('tagebuch-search').value = '';
      }
      addTagebuchEntry(input.value);
      input.value = '';
      input.focus();
    });
    document.getElementById('tagebuch-input').addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { e.target.value = ''; }
    });

    var search = document.getElementById('tagebuch-search');
    search.addEventListener('input', function () {
      tagebuchFilter = search.value;
      renderTagebuch();
    });
    search.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { search.value = ''; tagebuchFilter = ''; renderTagebuch(); }
    });
  }

  function initRoster() {
    roster = loadRoster();
    document.getElementById('mitglied-add-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var input = document.getElementById('mitglied-add-input');
      addRosterItem('mitglieder', input.value);
      input.value = '';
      input.focus();
    });
    document.getElementById('gegenstand-add-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var input = document.getElementById('gegenstand-add-input');
      addRosterItem('gegenstaende', input.value);
      input.value = '';
      input.focus();
    });
    renderRosterLists();
  }

  function initToolbar() {
    document.getElementById('btn-new').addEventListener('click', handleNewIncident);
    document.getElementById('btn-load').addEventListener('click', function () {
      document.getElementById('file-input').click();
    });
    document.getElementById('file-input').addEventListener('change', function (e) {
      var file = e.target.files[0];
      if (file) importJsonFile(file);
      e.target.value = '';
    });
    document.getElementById('btn-save').addEventListener('click', exportJson);
    document.getElementById('btn-pdf').addEventListener('click', printReport);
  }

  function tickClock() {
    var now = new Date();
    var text = pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
    document.querySelectorAll('.live-clock').forEach(function (el) { el.textContent = text; });
  }

  function init() {
    state = loadFromStorage() || blankState();
    initMetaFields();
    initForms();
    initToolbar();
    initRoster();
    initCsv();
    renderAll();
    tickClock();
    setInterval(tickClock, 1000);
    persist();
    var startInput = document.getElementById('tagebuch-input');
    if (startInput) startInput.focus();
  }

  init();
})();
</script>

</body>
</html>
